[build-system]
requires = [
    "setuptools>=69",
    "wheel>=0.43",
]
build-backend = "setuptools.build_meta"

[project]
name = "agave_pyvk"
version = "1.9.0"
description = "Headless in-process Vulkan Python bindings for AGAVE"
readme = "README.md"
license = { text = "Allen Institute Software License" }
requires-python = ">=3.10"
authors = [{ name = "Daniel Toloudis", email = "danielt@alleninstitute.org" }]
dependencies = ["numpy", "Pillow==12.2.0"]

[project.optional-dependencies]
test = ["pytest>=5.4.3", "ruff>=0.4"]

[tool.setuptools]
packages = ["agave_pyvk"]
include-package-data = true

[tool.setuptools.package-data]
agave_pyvk = ["*.pyd", "*.dll", "*.so", "*.so.*", "*.dylib", "assets/**/*"]

[tool.cibuildwheel]
build = "cp3{11,12,13,14}-*"
skip =  "cp38-* cp39-* cp310-* cp314t-win* cp315-* cp315t-* *_i686 *-win32 *-musllinux*"
archs = ["auto64"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
environment = {VULKAN_SDK = "/opt/1.4.350.1/x86_64", LD_LIBRARY_PATH = "/opt/curl/lib", PKG_CONFIG_PATH = "/opt/curl/lib/pkgconfig"}
before-all = [
    "dnf update -y",
    "dnf install -y epel-release",
    "dnf install -y cmake curl git libcurl-devel openssl-devel mesa-libEGL-devel mesa-libGL-devel xz-devel libtiff-devel libX11-devel libxcb-devel libzstd-devel nasm ninja-build patch pkgconfig spdlog-devel xz zlib-devel",
    "python3 -m pip install ninja",
    
    "curl --fail --location https://sdk.lunarg.com/sdk/download/1.4.350.1/linux/vulkan_sdk.tar.xz --output /tmp/vulkan_sdk.tar.xz",
    "echo '6cce33c7e5383814150c5041820769d93c65a1fd883002e5949b067045a07daa  /tmp/vulkan_sdk.tar.xz' | sha256sum --check",
    "mkdir -p /opt && tar -xf /tmp/vulkan_sdk.tar.xz -C /opt",

    "curl --fail --location https://curl.se/download/curl-8.10.1.tar.gz --output /tmp/curl-8.10.1.tar.gz",
    "echo 'd15ebab765d793e2e96db090f0e172d127859d78ca6f6391d7eafecfd894bbc0  /tmp/curl-8.10.1.tar.gz' | sha256sum --check",
    "tar -xf /tmp/curl-8.10.1.tar.gz -C /tmp",

    "cmake -S /tmp/curl-8.10.1 -B /tmp/curl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/curl -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_LIBCURL_DOCS=OFF -DBUILD_MISC_DOCS=OFF -DHTTP_ONLY=ON -DCURL_USE_OPENSSL=ON -DCURL_USE_LIBPSL=OFF -DCURL_USE_LIBSSH2=OFF -DUSE_LIBIDN2=OFF",
    "cmake --build /tmp/curl-build --parallel",
    "cmake --install /tmp/curl-build",
    
    "/opt/curl/bin/curl-config --version",
]
before-build = """cmake -G Ninja -S {package}/.. -B {package}/../build-cibw-linux -USKBUILD_* -U_Python* -UPython_* -UNB_SUFFIX* -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DCMAKE_PREFIX_PATH=/opt/curl -DCURL_DIR=/opt/curl/lib/cmake/CURL -DTENSORSTORE_USE_SYSTEM_OPENSSL=ON -DAGAVE_BUILD_APP=OFF -DAGAVE_BUILD_TESTS=OFF -DAGAVE_BUILD_PYVK=ON -DCMAKE_BUILD_TYPE=Release && cmake --build {package}/../build-cibw-linux --target stage_agave_pyvk --config Release --parallel"""

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
before-build = """cmake -S {package}/.. -B {package}/../build -USKBUILD_* -U_Python* -UPython_* -UNB_SUFFIX* -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DAGAVE_BUILD_APP=OFF -DAGAVE_BUILD_TESTS=OFF -DAGAVE_BUILD_PYVK=ON -DCMAKE_BUILD_TYPE=Release && cmake --build {package}/../build --target stage_agave_pyvk --config Release --parallel"""

[tool.cibuildwheel.windows]
before-build = '''for /f "delims=" %P in ('python -c "import sys; print(sys.executable)"') do (cmake -S {package}/.. -B {package}/../build -USKBUILD_* -U_Python* -UPython_* -UNB_SUFFIX* -DPython_EXECUTABLE="%P" -DAGAVE_BUILD_APP=OFF -DAGAVE_BUILD_TESTS=OFF -DAGAVE_BUILD_PYVK=ON -DCMAKE_BUILD_TYPE=Release && cmake --build {package}/../build --target stage_agave_pyvk --config Release --parallel)'''

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "T10"]
ignore = ["E203", "E402"]
