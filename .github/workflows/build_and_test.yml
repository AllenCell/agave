name: C++ Build
on:
  push:
    branches-ignore:
      - "master"
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get --allow-releaseinfo-change update -y
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          sudo apt-get install -y python3-sphinx python3-sphinx-rtd-theme python3-pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Sphinx>=8.0.0 sphinx-copybutton myst-parser>=1.0 linkify-it-py>=2.0.0
          pip install -r docs/requirements.txt
      - name: Build HTML documentation
        run: |
          cd docs/
          make html
      - name: Build PDF documentation
        run: |
          cd docs/
          make latexpdf
      - uses: actions/upload-artifact@v6
        with:
          name: DocumentationHTML
          path: docs/_build/html/
      - uses: actions/upload-artifact@v6
        with:
          name: DocumentationPDF
          path: docs/_build/latex/agave.pdf
  docs_pythonclient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get --allow-releaseinfo-change update -y
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          sudo apt-get install -y python3-sphinx python3-sphinx-rtd-theme python3-pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Sphinx>=8.0.0 sphinx-copybutton myst-parser>=1.0 linkify-it-py>=2.0.0
          pip install -r agave_pyclient/docs/requirements.txt
      - name: Build HTML documentation
        run: |
          pip install -e agave_pyclient/
          cd agave_pyclient/docs/
          make html
      - name: Build PDF documentation
        run: |
          pip install -e agave_pyclient/
          cd agave_pyclient/docs/
          make latexpdf
      - uses: actions/upload-artifact@v6
        with:
          name: DocumentationPythonClientHTML
          path: agave_pyclient/docs/_build/html/
      - uses: actions/upload-artifact@v6
        with:
          name: DocumentationPythonClientPDF
          path: agave_pyclient/docs/_build/latex/agave_pyclient.pdf
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          modules: qtwebsockets qtimageformats
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.350.1
          cache: true
      - name: Diagnose Vulkan SDK installation
        shell: bash
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          find "$VULKAN_SDK/include/vulkan" -maxdepth 1 -name "vulkan.h" -print
          find "$VULKAN_SDK/lib" -maxdepth 1 \( -name "libvulkan*" -o -name "*shaderc*" \) -print
          find "$VULKAN_SDK/bin" -maxdepth 1 -name "glslc*" -print
      - name: Install dependencies
        run: sudo apt-get install libspdlog-dev libglm-dev libgl1-mesa-dev libegl1-mesa-dev libtiff-dev libzstd-dev libcurl4-openssl-dev nasm
      - name: Build and test
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target agave_test --config Release
          cmake --build build --target install --config Release
      - uses: actions/upload-artifact@v6
        with:
          name: agave-linux
          path: ./build/install/Release/agave-install

  macos-build:
    runs-on: macos-15
    env:
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          modules: qtwebsockets qtimageformats
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.350.1
          cache: true
      - name: Diagnose Vulkan SDK installation
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          find "$VULKAN_SDK/include/vulkan" -maxdepth 1 -name "vulkan.h" -print
          find "$VULKAN_SDK/lib" -maxdepth 1 \( -name "libvulkan*" -o -name "*shaderc*" \) -print
          find "$VULKAN_SDK/bin" -maxdepth 1 -name "glslc*" -print
      - name: Install dependencies
        run: |
          brew install spdlog nasm curl
          if [ -d /usr/local/include/openssl ]; then
            mv /usr/local/include/openssl /usr/local/include/openssl.bak
          fi
      - name: Build and test
        env:
          Qt6_DIR: ${{ runner.workspace }}/Qt/6.9.3/macos
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target agave_test --config Release
          cmake --build build --config Release
          cpack --config build/CPackConfig.cmake -B build -D CPACK_PACKAGE_FILE_NAME=agave-macos-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: agave-macos-arm64
          path: ./build/agave-macos-arm64.dmg

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          modules: qtwebsockets qtimageformats
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.350.0
          cache: true
      - name: Install dependencies
        shell: cmd
        run: |
          choco install nasm nsis -y
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          vcpkg install --triplet x64-windows tiff glm zlib libjpeg-turbo liblzma spdlog zstd curl
      - name: Remove bad Strawberry Perl patch binary in search path
        run: echo "C:\Program Files\git\usr\bin" >> $env:GITHUB_PATH
      - name: Diagnose Vulkan SDK installation
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Get-Item "$env:VULKAN_SDK\Include\vulkan\vulkan.h" -ErrorAction Continue
          Get-ChildItem "$env:VULKAN_SDK\Lib" -Filter "vulkan*" -ErrorAction Continue
          Get-ChildItem "$env:VULKAN_SDK\Bin" -Filter "glslc*" -ErrorAction Continue
          Get-ChildItem "$env:VULKAN_SDK\Lib" -Filter "*shaderc*" -ErrorAction Continue
      - name: Build and test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build --parallel --target agave_test --config Release
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build --parallel --config Release
          if errorlevel 1 exit /b %errorlevel%
          cpack --config build\CPackConfig.cmake -B build -D CPACK_PACKAGE_FILE_NAME=agave-win
      - uses: actions/upload-artifact@v6
        with:
          name: agave-win
          path: ./build/agave-win.exe

  linux-pyvk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.350.1
          cache: true
      - name: Install dependencies
        run: sudo apt-get install libspdlog-dev libglm-dev libgl1-mesa-dev libegl1-mesa-dev libtiff-dev libzstd-dev libcurl4-openssl-dev nasm
      - run: python -m pip install cibuildwheel==3.3.0
      - name: Build agave_pyvk wheels
        run: python -m cibuildwheel agave_pyvk --output-dir wheelhouse
      - name: Install and test the Python 3.12 wheel
        run: |
          python -m pip install pytest wheelhouse/*cp312*.whl
          python -c "from agave_pyvk import AgaveRenderer; import agave_pyvk._native"
          python -m pytest agave_pyvk/tests
      - uses: actions/upload-artifact@v6
        with:
          name: agave-pyvk-agave-linux
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos-pyvk-build:
    runs-on: macos-15
    env:
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.350.1
          cache: true
      - name: Install dependencies
        run: |
          brew install spdlog nasm curl
          if [ -d /usr/local/include/openssl ]; then
            mv /usr/local/include/openssl /usr/local/include/openssl.bak
          fi
          brew reinstall --build-from-source fmt webp
      - run: python -m pip install cibuildwheel==3.3.0
      - name: Build agave_pyvk wheels
        run: python -m cibuildwheel agave_pyvk --output-dir wheelhouse
      - name: Install and test the Python 3.12 wheel
        run: |
          python -m pip install pytest wheelhouse/*cp312*.whl
          python -c "from agave_pyvk import AgaveRenderer; import agave_pyvk._native"
          python -m pytest agave_pyvk/tests
      - uses: actions/upload-artifact@v6
        with:
          name: agave-pyvk-agave-macos-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error

  windows-pyvk-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.350.0
          cache: true
      - name: Install dependencies
        shell: cmd
        run: |
          choco install nasm -y
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          vcpkg install --triplet x64-windows tiff glm zlib libjpeg-turbo liblzma spdlog zstd curl
      - name: Remove bad Strawberry Perl patch binary in search path
        run: echo "C:\Program Files\git\usr\bin" >> $env:GITHUB_PATH
      - run: python -m pip install cibuildwheel==3.3.0
      - name: Build agave_pyvk wheels with MSVC 18
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          python -m cibuildwheel agave_pyvk --output-dir wheelhouse
      - name: Install and test the Python 3.12 wheel
        shell: pwsh
        run: |
          python -m pip install pytest
          $wheel = Get-ChildItem wheelhouse/*cp312*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          python -c "from agave_pyvk import AgaveRenderer; import agave_pyvk._native"
          python -m pytest agave_pyvk/tests
      - uses: actions/upload-artifact@v6
        with:
          name: agave-pyvk-agave-win
          path: wheelhouse/*.whl
          if-no-files-found: error

  lint-and-test-webclient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: |
          cd webclient
          npm ci
          npm run lint
          npm run typeCheck
          npm run test --if-present

  lint-and-test-pyclient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd agave_pyclient
          pip install .[test]
      - name: Lint with ruff
        run: |
          cd agave_pyclient
          ruff check agave_pyclient
          ruff format --check agave_pyclient
          pytest agave_pyclient/tests/
      - name: Test build package
        run: |
          cd agave_pyclient
          pip install build
          python -m build
