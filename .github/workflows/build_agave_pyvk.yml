name: Build agave_pyvk wheels

on:
  workflow_call:
  workflow_dispatch:

jobs:
  wheel:
    name: ${{ matrix.artifact }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agave-pyvk-linux-x86_64
          - os: windows-latest
            artifact: agave-pyvk-windows-x86_64
          - os: macos-15
            artifact: agave-pyvk-macos-arm64
            deployment-target: "11.0"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The top-level AGAVE configuration currently discovers Qt even though the
      # agave_pyvk target and its installed wheel do not link to Qt.
      - name: Install Qt configure-time dependency
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          modules: qtwebsockets qtimageformats

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@e7d6e7b937bde4503c7ba5c9584c9dc68f44c4b8
        with:
          version: 1.4.350.0
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libspdlog-dev libglm-dev libgl1-mesa-dev libegl1-mesa-dev libtiff-dev libzstd-dev libcurl4-openssl-dev nasm ninja-build

      - name: Install macOS dependencies
        if: contains(matrix.os, 'macos')
        run: |
          brew install spdlog nasm curl ninja
          if [ -d /usr/local/include/openssl ]; then
            mv /usr/local/include/openssl /usr/local/include/openssl.bak
          fi
        shell: bash

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          choco install nasm -y
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          vcpkg install --triplet x64-windows tiff glm zlib libjpeg-turbo liblzma spdlog zstd curl

      - name: Prefer the Git patch executable on Windows
        if: matrix.os == 'windows-latest'
        run: echo "C:\Program Files\git\usr\bin" >> $env:GITHUB_PATH

      - name: Install wheel build tools
        run: python -m pip install --upgrade pip build

      - name: Build Linux wheel
        if: matrix.os == 'ubuntu-latest'
        env:
          CC: gcc-13
          CXX: g++-13
        run: python -m build --wheel agave_pyvk

      - name: Build macOS wheel
        if: contains(matrix.os, 'macos')
        env:
          CC: clang
          CXX: clang++
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
          Qt6_DIR: ${{ runner.workspace }}/Qt/6.9.3/macos
        run: python -m build --wheel agave_pyvk
        shell: bash

      - name: Build Windows wheel with MSVC 18
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set "CMAKE_GENERATOR=Ninja"
          set "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          python -m build --wheel agave_pyvk

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: agave_pyvk/dist/*.whl
          if-no-files-found: error
