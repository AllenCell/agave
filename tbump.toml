# Uncomment this if your project is hosted on GitHub:
# github_url = "https://github.com/<user or organization>/<project>/"

[version]
current = "2.0.0-dev.1"

# Semver with a restricted set of prerelease identifiers.
# Allowed versions: X.Y.Z or X.Y.Z-{dev|rc|alpha|beta}.N
# Make sure this matches current_version before
# using tbump
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (?P<suffix>\-
    (?P<extra>dev|rc|alpha|beta)\.(?P<extraver>\d+)
  )?
  '''

[[field]]
name="suffix"
default=""
[[field]]
name="extra"
default=""
[[field]]
name="extraver"
default=""

[git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

# For each file to patch, add a [[file]] config
# section containing the path of the file, relative to the
# tbump.toml location.
# The project() call only accepts numeric versions, so the prerelease
# suffix is stripped here. The search regex anchors to the project() line.
[[file]]
src = "CMakeLists.txt"
version_template = "{major}.{minor}.{patch}"
search = 'VERSION {current_version}'
# Full semver version (including prerelease suffix) used for display strings.
[[file]]
src = "CMakeLists.txt"
search = 'AGAVE_FULL_VERSION "{current_version}"'
[[file]]
src = "agave_pyclient/pyproject.toml"
search = 'version = "{current_version}"'
[[file]]
src = "agave_pyclient/agave_pyclient/__init__.py"
[[file]]
src = "agave_py/pyproject.toml"
search = 'version = "{current_version}"'
[[file]]
src = "agave_py/agave_py/__init__.py"
search = '__version__ = "{current_version}"'
# The project() call only accepts numeric versions (see CMakeLists.txt above).
[[file]]
src = "agave_py/CMakeLists.txt"
version_template = "{major}.{minor}.{patch}"
search = 'VERSION {current_version}'
[[file]]
src = "agave_pyclient/docs/conf.py"
[[file]]
src = "docs/conf.py"
[[file]]
src = "webclient/package.json"
[[file]]
src = "INSTALL.md"

# You can specify a list of commands to
# run after the files have been patched
